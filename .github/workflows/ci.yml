name: checks

on:
  push:
  pull_request:

jobs:
  node:
    name: JS tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        run: node --test

  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        working-directory: python
        run: python -m unittest discover -s tests -p "test_*.py"
